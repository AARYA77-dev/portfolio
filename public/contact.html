<script>
    setupMobileNav();

    function setupMobileNav() {
        const nav = document.querySelector(".nav");
        const menuToggle = document.querySelector(".menu-toggle");
        const menu = document.querySelector(".menu");

        if (!nav || !menuToggle || !menu) return;

        function setMenu(open) {
            nav.classList.toggle("menu-open", open);
            document.body.classList.toggle("menu-open", open);
            menuToggle.setAttribute("aria-expanded", open ? "true" : "false");
            menuToggle.innerHTML = open
                ? '<i class="fa-solid fa-xmark"></i>'
                : '<i class="fa-solid fa-bars"></i>';
        }

        menuToggle.addEventListener("click", () => {
            setMenu(!nav.classList.contains("menu-open"));
        });

        menu.querySelectorAll("a").forEach((link) => {
            link.addEventListener("click", () => setMenu(false));
        });

        window.addEventListener("keydown", (event) => {
            if (event.key === "Escape") setMenu(false);
        });

        window.addEventListener("resize", () => {
            if (window.innerWidth > 768) setMenu(false);
        });
    }

    const THEME_KEY = "theme";
    const toggle = document.getElementById("toggle");

    function getThemeOriginPoint() {
        const img = document.querySelector(".image-ring img") ||
            document.querySelector(".image-ring") ||
            document.querySelector("img[src*='aarya']");

        if (img) {
            const rect = img.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
                return {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
            }
        }
        const toggleLabel = document.querySelector(".darkModeLabel");
        if (toggleLabel) {
            const rect = toggleLabel.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }
        return {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2
        };
    }

    function applyTheme(theme) {
        const isDark = theme === "dark";
        document.body.classList.toggle("dark", isDark);
        if (toggle) toggle.checked = isDark;
    }

    function switchThemeWithRipple(theme) {
        if (document.documentElement.classList.contains("theme-transitioning")) return;

        const { x, y } = getThemeOriginPoint();
        const endRadius = Math.hypot(
            Math.max(x, window.innerWidth - x),
            Math.max(y, window.innerHeight - y)
        );

        if (document.startViewTransition && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            document.documentElement.classList.add("theme-transitioning");

            const transition = document.startViewTransition(() => {
                applyTheme(theme);
            });

            transition.ready.then(() => {
                document.documentElement.animate(
                    {
                        clipPath: [
                            `circle(0px at ${x}px ${y}px)`,
                            `circle(${endRadius}px at ${x}px ${y}px)`
                        ]
                    },
                    {
                        duration: 750,
                        easing: "cubic-bezier(0.4, 0, 0.2, 1)",
                        pseudoElement: "::view-transition-new(root)"
                    }
                );
            });

            transition.finished.then(() => {
                document.documentElement.classList.remove("theme-transitioning");
            });
        } else {
            const isDark = theme === "dark";
            const rippleColor = isDark ? "#040711" : "#eef5ff";

            const ripple = document.createElement("div");
            ripple.className = "theme-ripple-overlay";
            ripple.style.background = rippleColor;

            document.body.appendChild(ripple);

            const animation = ripple.animate(
                [
                    {
                        width: "0px",
                        height: "0px",
                        left: `${x}px`,
                        top: `${y}px`
                    },
                    {
                        width: `${endRadius * 2}px`,
                        height: `${endRadius * 2}px`,
                        left: `${x - endRadius}px`,
                        top: `${y - endRadius}px`
                    }
                ],
                {
                    duration: 750,
                    easing: "cubic-bezier(0.4, 0, 0.2, 1)"
                }
            );

            animation.onfinish = () => {
                applyTheme(theme);
                ripple.remove();
            };
        }
    }

    const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
    applyTheme(savedTheme);

    if (toggle) {
        toggle.addEventListener("change", () => {
            const theme = toggle.checked ? "dark" : "light";
            localStorage.setItem(THEME_KEY, theme);
            switchThemeWithRipple(theme);
        });

        const toggleLabel = document.querySelector(".darkModeLabel");
        if (toggleLabel) {
            toggleLabel.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    toggle.checked = !toggle.checked;
                    toggle.dispatchEvent(new Event("change"));
                }
            });
        }
    }

</script>

        authDomain: "aarya-dev.firebaseapp.com",
        projectId: "aarya-dev",
        storageBucket: "aarya-dev.firebasestorage.app",
        messagingSenderId: "4879273345",
        measurementId: "G-CEEVTM2ZN4",
        appId: "1:4879273345:web:6f604065811acea1e52c80"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const analytics = getAnalytics(app);

    const form = document.getElementById("contactForm");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const button = form.querySelector("button");
        button.disabled = true;
        button.textContent = "Sending...";

        const name = document.getElementById("userName").value;
        const email = document.getElementById("userEmail").value;
        const message = document.getElementById("userMessage").value;

        try {
            await addDoc(collection(db, "contacts"), {
                name,
                email,
                message,
                createdAt: serverTimestamp()
            });

            toastr.success("Message sent successfully");
            form.reset();
        } catch (error) {
            console.error(error);
            toastr.error("Something went wrong");
        } finally {
            button.disabled = false;
            button.textContent = "Send Message";
        }
    });
</script>
